# Copy to config.yaml and edit.  `python -m duo_tracker models` lists the keys.
zip: "11754"               # Kings Park, NY: enter this in the bot's browser during setup
models:                    # 256GB/512GB are what actually drop; 1TB/2TB almost never do
  - 256gb-nightsky
  - 256gb-starwhite
  - 512gb-nightsky
  - 512gb-starwhite

carrier: unlocked          # unlocked | att | tmobile | verizon

# Optional: only alert for these stores (matches store name, city, or number like R095).
# Leave empty to alert for any store Apple returns near your saved location.
# Long Island stores with a Duo drop history (names and Apple store numbers both match).
stores: ["Smith Haven", "R139", "Walt Whitman", "R068", "Roosevelt Field", "R060", "Manhasset", "R327"]
max_miles: 30              # ignore stores farther than this (remove the line for no limit)
alert_on_courier: true     # also alert when same-day courier delivery opens up

# When to check. Long Island drops land ~7:30–9:30am ET (some around midnight)
# and last ~1 minute, so check faster then and slower otherwise. If Apple
# blocks a check inside a fast window, that window falls back to
# default_seconds until it ends. `./duo blocks` shows when blocks happen.
schedule:
  timezone: America/New_York
  default_seconds: 90      # minimum 30
  windows:
    - {start: "07:30", end: "09:30", seconds: 30}
    - {start: "23:30", end: "00:30", seconds: 30}   # wraps past midnight
blocked_backoff_seconds: 600

ntfy:
  server: https://ntfy.sh
  topic: ""                # pick something long & unguessable, e.g. duo-7f3k9q2xw

checkout:
  # alert  – push notification only
  # bag    – also add the in-stock model to your bag and open it (default)
  # review – also fill in checkout (pickup at that store, saved card) and stop
  #          on the review page; you click Place Order
  # submit – full auto: places the order. Needs a passing `rehearse` in the
  #          last 7 days, buys at most once (~/.duo-tracker/order.lock), and
  #          stops on sign-in/2FA, security-code prompts, wrong model/store,
  #          or a total over the cap.
  mode: bag
  # max_total: 2250        # hard cap on the order total; default = model price × 1.11

health:
  daily_summary_hour: 9    # daily "still watching" push; null to disable
  stall_minutes: 10        # alert if no successful check for this long
  healthcheck_url: ""      # optional healthchecks.io ping URL: alerts you if the whole box goes offline

signin_check_minutes: 60   # review/submit modes: confirm you're still signed in to Apple

browser:
  channel: chrome          # uses your installed Google Chrome; "chromium" for Playwright's bundled one
  profile_dir: ~/.duo-tracker/profile
